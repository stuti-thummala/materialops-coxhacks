name: materialops_worker
description: "MaterialOps Worker — Mercedes-Benz Stadium post-event material recovery worker app with on-device computer-vision material detection."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.0

  # Camera + on-device computer vision
  camera: ^0.11.0+1
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/

  # NOTE on fonts:
  # Display + body fonts (IBM Plex Sans, Space Grotesk, Inter) are loaded at
  # runtime via the google_fonts package (see lib/theme/app_theme.dart), so no
  # bundled font files are required here.
