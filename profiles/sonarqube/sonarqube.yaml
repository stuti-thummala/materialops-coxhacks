---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: sonarqube-scan
        name: SonarQube Scan
        entry: sonar-scanner
        language: system
        pass_filenames: false
        always_run: true
        args:
          - -Dproject.settings=sonar-project.properties
