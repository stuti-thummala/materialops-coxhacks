---
name: Build and publish the Docker images

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOCKER_IMAGE_BASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest'}}

jobs:
  Build:
    runs-on: [self-hosted, Linux, CAI-Enterprise]
    steps:
      - name: Setup JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.ARTIFACTORY_URL }}
        with:
          oidc-provider-name: ${{ vars.ARTIFACTORY_OIDC_PROVIDER_NAME }}

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_IMAGE_TAG: ${{ env.DOCKER_IMAGE_BASE_TAG }}
        with:
          build-args: |
            DOCKER_REGISTRY=${{ vars.DOCKER_REGISTRY }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ vars.DOCKER_REGISTRY }}/${{ vars.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
